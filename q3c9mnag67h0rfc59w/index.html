<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>Private · Card Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230F172A'/%3E%3Crect x='18' y='29' width='28' height='20' rx='4' fill='%23fff'/%3E%3Cpath d='M24 29v-6a8 8 0 0 1 16 0v6' fill='none' stroke='%23fff' stroke-width='5'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      color-scheme: light;
      --font-heading: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg: #F5F7FA;
      --surface: #FFFFFF;
      --surface-2: #F8FAFC;
      --text: #0F172A;
      --text-2: #334155;
      --muted: #64748B;
      --border: #E4E8EE;
      --border-strong: #CBD5E1;
      --ring: #2563EB;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2.5px solid var(--ring);
      outline-offset: 2px;
    }

    /* ---------------------------------------------------------------- lock screen */
    .lock {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 1px 1px, rgba(100, 116, 139, 0.16) 1px, transparent 1.6px) 0 0 / 20px 20px,
        radial-gradient(ellipse at 50% 30%, #FFFFFF 0%, var(--bg) 70%);
    }

    .lock-card {
      width: min(100%, 420px);
      padding: 30px 28px 26px;
      border-radius: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 24px 48px -24px rgba(15, 23, 42, 0.3);
      text-align: center;
    }

    .lock-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: #0F172A;
      color: #FFFFFF;
      box-shadow: 0 10px 24px -10px rgba(15, 23, 42, 0.55);
    }

    .lock-card h1 {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .lock-card > p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .lock-form {
      margin-top: 22px;
      text-align: left;
    }

    .lock-form label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-2);
    }

    .key-row {
      display: flex;
      gap: 8px;
    }

    .key-row input {
      flex: 1;
      min-width: 0;
      padding: 11px 13px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .key-row input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      background: #FFFFFF;
    }

    .key-row button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      background: #0F172A;
      color: #FFFFFF;
      font-weight: 600;
      cursor: pointer;
    }

    .key-row button:disabled {
      opacity: 0.6;
      cursor: progress;
    }

    .lock-error {
      min-height: 1.4em;
      margin-top: 8px;
      font-size: 0.84rem;
      color: #B42318;
    }

    .lock-note {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .lock.is-busy .lock-card {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="lock" id="lockScreen">
    <div class="lock-card">
      <div class="lock-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1>Private page</h1>
      <p>Enter your access key to open the card manager.</p>
      <form class="lock-form" id="unlockForm" autocomplete="on">
        <input type="text" name="username" value="card-manager" autocomplete="username" hidden />
        <label for="accessKey">Access key</label>
        <div class="key-row">
          <input id="accessKey" name="password" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off" placeholder="xxxxx-xxxxx-xxxxx-xxxxx" required />
          <button type="submit" id="unlockBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
            Unlock
          </button>
        </div>
        <p class="lock-error" id="lockError" role="alert"></p>
      </form>
      <p class="lock-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
        Encrypted with AES-256. Nothing opens without the key.
      </p>
    </div>
  </div>
  <div id="appRoot"></div>

      var SESSION_KEY = 'cardManagerKey';

      var lock = document.getElementById('lockScreen');
      var form = document.getElementById('unlockForm');
      var input = document.getElementById('accessKey');
      var button = document.getElementById('unlockBtn');
      var error = document.getElementById('lockError');

      function bytes(b64) {
        return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
      }

      function normalise(value) {
        return String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      }

      async function decrypt(secret) {
        var material = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
        var key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(VAULT.salt), iterations: VAULT.iter, hash: 'SHA-256' },
          material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
        var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(VAULT.iv) }, key, bytes(VAULT.data));
        return JSON.parse(new TextDecoder().decode(plain));
      }

      function mount(app) {
        var style = document.createElement('style');
        style.textContent = app.css;
        document.head.appendChild(style);
        document.getElementById('appRoot').innerHTML = app.html;
        lock.remove();
        window.__lockManager = function () {
          try { sessionStorage.removeItem(SESSION_KEY); } catch (_) {}
          location.replace(location.pathname);
        };
        new Function(app.js)();
      }

      async function unlock(raw) {
        var secret = normalise(raw);
        if (!secret) return false;
        try {
          var app = await decrypt(secret);
          try { sessionStorage.setItem(SESSION_KEY, secret); } catch (_) {}
          mount(app);
          return true;
        } catch (_) {
          return false;
        }
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        error.textContent = '';
        button.disabled = true;
        lock.classList.add('is-busy');
        var ok = await unlock(input.value);
        if (!ok) {
          button.disabled = false;
          lock.classList.remove('is-busy');
          error.textContent = 'That access key is not correct.';
          input.select();
        }
      });

      if (!window.crypto || !crypto.subtle) {

      }

      window.addEventListener('hashchange', async function () {
        var fromLink = decodeURIComponent((location.hash || '').slice(1));
        if (fromLink && document.getElementById('lockScreen') && !(await unlock(fromLink))) {
          error.textContent = 'The key in this link is not correct.';
        }
      });

      (async function autoUnlock() {
        var fromLink = decodeURIComponent((location.hash || '').slice(1));
        var fromSession = null;
        try { fromSession = sessionStorage.getItem(SESSION_KEY); } catch (_) {}
        if (fromLink && (await unlock(fromLink))) return;
        if (fromSession && (await unlock(fromSession))) return;
        if (fromLink) error.textContent = 'The key in this link is not correct.';
        input.focus();
      })();
    })();
  </script>
</body>
</html>
