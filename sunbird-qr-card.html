<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rohana Hettiarachchi — Sunbird Lanka Tours QR Business Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 35%, #f8fafc 0%, #eef2f6 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 18px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #0f172a;
    }

    /* Executive White & Red Topographic Business Card (1.65 : 1) */
    .topo-qr-card {
      position: relative;
      width: min(100%, 600px);
      aspect-ratio: 1.65 / 1;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid rgba(15, 112, 184, 0.45);
      box-shadow:
        0 28px 60px -12px rgba(15, 23, 42, 0.16),
        0 0 0 1px rgba(15, 112, 184, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 36px 22px;
    }

    /* Top Sunbird Blue Crown Bar */
    .topo-qr-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #0C3866 0%, #0F70B8 28%, #29ABE1 50%, #0F70B8 72%, #0C3866 100%);
      z-index: 4;
    }

    /* Subtle Architectural Inner Red Hairline Frame */
    .topo-qr-card::after {
      content: "";
      position: absolute;
      inset: 13px 11px 11px 11px;
      border: 1px solid rgba(15, 112, 184, 0.22);
      border-radius: 7px;
      pointer-events: none;
      z-index: 3;
    }

    /* Continuous Unbroken Sunbird Blue Topographic Contour Map Background on White */
    .topo-bg-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 1;
    }

    /* Soft Radial White Vignette Behind Foreground Elements (No Box Cutoff) */
    .ambient-vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 76% 68% at 50% 48%, rgba(255, 255, 255, 0.62) 0%, rgba(255, 255, 255, 0.22) 65%, transparent 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Foreground Content Floating Seamlessly Over Continuous Pattern */
    .card-content {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    .main-elements-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 44px;
    }

    /* Circular Profile Picture in Double Sunbird Blue Bezel */
    .profile-red-wrap {
      position: relative;
      width: 164px;
      height: 164px;
      border-radius: 50%;
      padding: 4.5px;
      background: linear-gradient(135deg, #29ABE1 0%, #0C3866 48%, #0F70B8 100%);
      box-shadow:
        0 16px 36px rgba(15, 112, 184, 0.22),
        0 6px 18px rgba(15, 23, 42, 0.12);
      flex-shrink: 0;
    }

    .profile-red-wrap::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.55);
      pointer-events: none;
    }

    .profile-red-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 16%;
      border: 3.5px solid #ffffff;
      display: block;
    }

    /* Refined Center Red Divider with Diamond Emblem */
    .center-divider {
      position: relative;
      width: 1.5px;
      height: 132px;
      background: linear-gradient(180deg, transparent 0%, rgba(15, 112, 184, 0.85) 50%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .center-divider::after {
      content: "";
      width: 7px;
      height: 7px;
      background: #0F70B8;
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(15, 112, 184, 0.45);
      border: 1px solid #ffffff;
    }

    /* Clickable QR Code Frame Opening Sunbird Digital Card */
    .qr-red-link {
      position: relative;
      width: 164px;
      height: 164px;
      border-radius: 18px;
      padding: 4.5px;
      background: linear-gradient(135deg, #29ABE1 0%, #0C3866 48%, #0F70B8 100%);
      box-shadow:
        0 16px 36px rgba(15, 112, 184, 0.22),
        0 6px 18px rgba(15, 23, 42, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.24s ease;
    }

    .qr-red-link:hover {
      transform: translateY(-3px) scale(1.025);
      box-shadow:
        0 22px 44px rgba(15, 112, 184, 0.32),
        0 8px 22px rgba(15, 23, 42, 0.15);
    }

    .qr-inner-box {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 14px;
      border: 3px solid #ffffff;
      padding: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-inner-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Architectural Businessman Name Lockup in Sunbird Blue */
    .name-lockup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      padding: 4px 12px;
      text-decoration: none;
    }

    .name-rule {
      height: 1.5px;
      width: 48px;
      background: linear-gradient(90deg, transparent, #0F70B8);
      opacity: 0.85;
    }

    .name-rule.right {
      background: linear-gradient(90deg, #0F70B8, transparent);
    }

    .name-diamond {
      color: #0F70B8;
      font-size: 0.55rem;
      line-height: 1;
    }

    .businessman-name {
      font-family: 'Cinzel', 'Plus Jakarta Sans', Georgia, serif;
      font-size: 1.24rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #0C3866 0%, #0F70B8 50%, #0C3866 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #0F70B8;
      text-shadow: 0 2px 12px rgba(255, 255, 255, 0.95);
      white-space: nowrap;
    }

    /* Action Bar for Email Copy & Printing */
    .actions-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: min(100%, 600px);
    }

    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .action-btn {
      background: linear-gradient(135deg, #0F70B8 0%, #0C3866 100%);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 8px 20px rgba(15, 112, 184, 0.28);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    .action-btn:hover {
      transform: translateY(-1.5px);
      filter: brightness(1.06);
      box-shadow: 0 12px 24px rgba(15, 112, 184, 0.36);
    }

    .action-btn.secondary {
      background: #ffffff;
      color: #0F70B8;
      border: 1px solid rgba(15, 112, 184, 0.35);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    .copy-status {
      font-size: 0.78rem;
      color: #15803d;
      font-weight: 700;
      min-height: 1.2em;
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .copy-status.visible {
      opacity: 1;
    }

    #emailClipboardSource {
      position: fixed;
      left: -9999px;
      top: 0;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 520px) {
      .topo-qr-card {
        padding: 18px 20px 14px;
      }
      .main-elements-row {
        gap: 22px;
      }
      .profile-red-wrap,
      .qr-red-link {
        width: 116px;
        height: 116px;
      }
      .center-divider {
        height: 88px;
      }
      .businessman-name {
        font-size: 0.88rem;
        letter-spacing: 0.11em;
      }
      .name-rule {
        width: 24px;
      }
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .actions-wrapper,
      #emailClipboardSource {
        display: none !important;
      }
      .topo-qr-card {
        width: 3.5in;
        height: 2in;
        box-shadow: none;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>

  <script>
    function showCopyStatus(msg) {
      const el = document.getElementById('copyStatus');
      el.textContent = msg;
      el.classList.add('visible');
      clearTimeout(window.__copyTimer);
      window.__copyTimer = setTimeout(() => {
        el.classList.remove('visible');
      }, 4500);
    }

    function getEmailHtmlString() {
      return document.getElementById('emailClipboardSource').innerHTML.trim();
    }

    async function copyRichEmailCard() {
      const htmlContent = getEmailHtmlString();
      const plainText = "Rohana Hettiarachchi — Sunbird Lanka Tours Digital Business Card: https://vockshel-gif.github.io/RohanaHettiarachchi/sunbird.html";

      try {
        if (navigator.clipboard && window.ClipboardItem) {
          const htmlBlob = new Blob([htmlContent], { type: 'text/html' });
          const textBlob = new Blob([plainText], { type: 'text/plain' });
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': htmlBlob,
              'text/plain': textBlob
            })
          ]);
          showCopyStatus('✓ Copied! Press Ctrl+V (or Cmd+V) directly inside your Gmail / Outlook email body.');
          return;
        }
      } catch (err) {
        // Fallback below
      }

      const sourceDiv = document.getElementById('emailClipboardSource');
      sourceDiv.style.position = 'fixed';
      sourceDiv.style.opacity = '0.01';
      sourceDiv.style.pointerEvents = 'auto';

      const range = document.createRange();
      range.selectNodeContents(sourceDiv);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

      try {
        document.execCommand('copy');
        showCopyStatus('✓ Copied! Press Ctrl+V (or Cmd+V) directly inside your Gmail / Outlook email body.');
      } catch (e) {
        showCopyStatus('Could not auto-copy. Try clicking "Copy HTML Email Code".');
      }

      sel.removeAllRanges();
      sourceDiv.style.pointerEvents = 'none';
      sourceDiv.style.opacity = '0';
    }

    async function copyRawHtmlEmailCode() {
      const htmlContent = getEmailHtmlString();
      try {
        await navigator.clipboard.writeText(htmlContent);
        showCopyStatus('✓ Raw HTML Email code copied to clipboard!');
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = htmlContent;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showCopyStatus('✓ Raw HTML Email code copied to clipboard!');
      }
    }
  </script>
