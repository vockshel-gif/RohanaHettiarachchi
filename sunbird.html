<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no" />
  <meta name="theme-color" content="#0F70B8" />
  <title>Rohana Hettiarachchi — CEO &amp; Managing Director | Sunbird Lanka Tours</title>
  <meta name="description" content="Rohana Hettiarachchi — CEO &amp; Managing Director, National Tourist Guide Lecturer at Sunbird Lanka Tours. Digital business card with an illustrated Sri Lanka tourist map." />
  <link rel="icon" type="image/png" href="sunbird-emblem.png" />

  <script>
    /* Print sheet mode: ?print (both sides, 56 x 96 mm pages incl. 3 mm bleed), ?print=front, ?print=back, ?print=pdf */
    (function () {
      var root = document.documentElement;
      var mode = new URLSearchParams(location.search).get('print');
      if (mode !== null) {
        root.classList.add('print-mode');
        if (mode === 'front' || mode === 'back') root.classList.add('print-only-' + mode);
        if (mode === 'pdf') {
          /* Oversized page for exact-size PDF export; the export script crops each page to 56 x 96 mm */
          var pageStyle = document.createElement('style');
          pageStyle.textContent = '@page { size: 70mm 110mm; margin: 0; }';
          document.head.appendChild(pageStyle);
        }
      }
      window.addEventListener('beforeprint', function () { root.classList.add('print-mode'); });
      window.addEventListener('afterprint', function () { if (mode === null) root.classList.remove('print-mode'); });
    })();
  </script>

  <!-- Preload Critical Images for Instant Render -->
  <link rel="preload" as="image" href="sunbird-logo.png" fetchpriority="high" />
  <link rel="preload" as="image" href="Profile.jpg" fetchpriority="high" />

  <!-- Sunbird Brand Typography (Barlow family, as used on the printed card) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       Sunbird Lanka Tours — Rohana Hettiarachchi
       Portrait business card, 50 x 90 mm trim (+3 mm bleed for print)
       Design grid: 400 x 720 px card = 50 x 90 mm (8 px = 1 mm)
       Front: brand identity & contacts • Back: illustrated Sri Lanka tourist map
       ========================================================================== */

    :root {
      --font-heading: 'Barlow Condensed', 'Arial Narrow', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      --sb-blue: #1D75BA;
      --sb-blue-band: #0F70B8;
      --sb-blue-deep: #0C3866;
      --sb-cyan: #29ABE1;
      --sb-gold: #F7AC3B;
      --sb-gold-deep: #D98E1F;
      --sb-blue-soft: rgba(29, 117, 186, 0.1);
      --text-dark: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;

      --card-w: 400px;
      --card-h: 720px;
      --card-radius: 20px;
      --card-scale: 1;
      --bleed: 0px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #F7FBFE 0%, #E4F0FA 100%);
      background-color: #EEF5FB;
      font-family: var(--font-body);
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .card-viewport-box {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      flex-shrink: 0;
      transform: scale(var(--card-scale, 1));
      transform-origin: center center;
      will-change: transform;
    }

    .card-scene {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      perspective: 2000px;
      -webkit-perspective: 2000px;
    }

    /* ==========================================================================
       One-Time On-Card Swipe Overlay (Plays Once on the Card and Disappears)
       ========================================================================== */
    .card-swipe-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .card-swipe-overlay.is-dismissed {
      opacity: 0;
      visibility: hidden;
    }

    .swipe-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 24px 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(15, 112, 184, 0.22);
      box-shadow: 0 16px 36px -8px rgba(12, 56, 102, 0.25);
      animation: swipeBadgeLifecycle 2.5s cubic-bezier(0.22, 1, 0.36, 1) 1 forwards;
    }

    .swipe-hand-svg {
      overflow: visible;
      animation: handSwipeOnce 1.15s ease-in-out 2;
      transform-origin: 50% 80%;
    }

    .swipe-caption {
      font-family: var(--font-heading);
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sb-blue-band);
      white-space: nowrap;
    }

    @keyframes handSwipeOnce {
      0%, 100% { transform: translateX(-9px) rotate(-6deg); }
      50% { transform: translateX(11px) rotate(8deg); }
    }

    @keyframes swipeBadgeLifecycle {
      0% { opacity: 0; transform: scale(0.92); }
      14% { opacity: 1; transform: scale(1); }
      82% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.95); }
    }

    /* ==========================================================================
       3D Card & Faces
       ========================================================================== */
    .business-card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      will-change: transform;
      touch-action: none;
      cursor: grab;
      outline: none;
    }

    .business-card:active {
      cursor: grabbing;
    }

    .business-card img,
    .business-card image {
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: var(--bleed);
      border-radius: var(--card-radius);
      background-color: #FFFFFF;
      border: 1px solid rgba(15, 112, 184, 0.14);
      box-shadow:
        0 30px 60px -16px rgba(12, 56, 102, 0.28),
        0 8px 22px -6px rgba(15, 112, 184, 0.14);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-face--front {
      transform: rotateY(0deg) translateZ(1px);
      background:
        radial-gradient(circle at 50% 27%, rgba(247, 172, 59, 0.12) 0%, rgba(247, 172, 59, 0) 40%),
        radial-gradient(circle at 50% 0%, #F2F9FE 0%, #FFFFFF 55%);
    }

    .card-face--back {
      transform: rotateY(180deg) translateZ(1px);
      background: #1A78BC;
      border-color: rgba(12, 56, 102, 0.3);
    }

    /* Top Two-Tone Accent Bar (Sunbird Blue + Cyan + Gold) */
    .card-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: calc(5px + var(--bleed));
      z-index: 3;
      background: linear-gradient(90deg, var(--sb-blue-band) 0%, var(--sb-blue-band) 70%, var(--sb-cyan) 70%, var(--sb-cyan) 84%, var(--sb-gold) 84%, var(--sb-gold) 100%);
    }

    /* ==========================================================================
       FRONT SIDE
       ========================================================================== */
    .front-brand {
      display: flex;
      justify-content: center;
      padding-top: 30px;
    }

    .brand-logo {
      width: 206px;
      height: auto;
      display: block;
    }

    .front-identity {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 22px;
    }

    .profile-halo {
      position: relative;
      width: 126px;
      height: 126px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sun-rays {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 164px;
      height: 164px;
      margin: -82px 0 0 -82px;
      pointer-events: none;
      animation: sunSpin 70s linear infinite;
    }

    @keyframes sunSpin {
      to { transform: rotate(360deg); }
    }

    .profile-frame {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 3px;
      background: conic-gradient(from 200deg, var(--sb-blue-band), var(--sb-cyan), var(--sb-gold), var(--sb-blue-band));
      box-shadow: 0 12px 26px -8px rgba(12, 56, 102, 0.34);
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 18%;
      border: 3px solid #FFFFFF;
      display: block;
      background-color: #F1F5F9;
    }

    .person-name {
      margin-top: 16px;
      font-family: var(--font-heading);
      font-size: 2.16rem;
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: 0.005em;
      color: var(--sb-blue);
    }

    .person-role {
      margin-top: 7px;
      display: inline-block;
      font-family: var(--font-heading);
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sb-blue-deep);
      padding: 0 6px 3px;
      border-bottom: 2.5px solid var(--sb-gold);
    }

    .person-title {
      margin-top: 7px;
      font-size: 1.02rem;
      font-weight: 500;
      color: var(--sb-blue);
    }

    .person-credentials {
      margin-top: 1px;
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }

    .card-divider {
      position: relative;
      margin: 15px 24px 0;
      height: 1px;
      background: linear-gradient(90deg, rgba(15, 112, 184, 0) 0%, rgba(15, 112, 184, 0.28) 18%, rgba(15, 112, 184, 0.28) 82%, rgba(15, 112, 184, 0) 100%);
    }

    .card-divider::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      background: var(--sb-gold);
      transform: rotate(45deg);
      border-radius: 1.5px;
      box-shadow: 0 0 0 4px #FFFFFF;
    }

    .front-details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 24px 0;
    }

    .front-contacts {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .contact-group {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      min-width: 0;
    }

    .contact-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      height: 27px;
      border-radius: 8px;
      background-color: var(--sb-blue-soft);
      color: var(--sb-blue);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .contact-lines {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .contact-line {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .contact-link {
      font-size: 0.97rem;
      font-weight: 500;
      line-height: 1.22;
      color: var(--sb-blue-deep);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.18s ease;
    }

    .contact-link--email,
    .contact-link--address {
      font-size: 0.9rem;
    }

    .contact-link--address {
      white-space: normal;
    }

    .contact-link:hover {
      color: var(--sb-blue);
    }

    .wa-icon {
      display: inline-flex;
      color: #25D366;
      line-height: 0;
    }

    .qr-tile {
      flex-shrink: 0;
      width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 8px 8px 7px;
      border-radius: 14px;
      border: 1.5px solid rgba(15, 112, 184, 0.24);
      background: #FFFFFF;
      cursor: pointer;
      font: inherit;
      color: inherit;
      transition: border-color 0.18s ease, transform 0.18s ease;
    }

    .qr-tile:hover {
      border-color: var(--sb-blue);
    }

    .qr-tile:active {
      transform: scale(0.97);
    }

    .qr-image {
      width: 104px;
      height: 104px;
      display: block;
    }

    .qr-caption {
      font-family: var(--font-heading);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sb-blue-band);
      line-height: 1;
      white-space: nowrap;
    }

    /* Sri Lanka Skyline Scene + Website Band (bottom of front) */
    .front-scene {
      position: absolute;
      left: var(--bleed);
      right: var(--bleed);
      bottom: calc(40px + var(--bleed));
      height: 132px;
      pointer-events: none;
    }

    .front-scene svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .web-band {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(40px + var(--bleed));
      padding-bottom: var(--bleed);
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(90deg, var(--sb-blue-band) 0%, #1580C9 50%, var(--sb-blue-band) 100%);
      border-top: 3px solid var(--sb-gold);
      color: #FFFFFF;
      font-family: var(--font-body);
      font-size: 0.96rem;
      font-weight: 600;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      text-decoration: none;
    }

    /* ==========================================================================
       BACK SIDE — ILLUSTRATED SRI LANKA TOURIST MAP (full bleed)
       ========================================================================== */
    .tour-map {
      position: absolute;
      left: var(--bleed);
      top: var(--bleed);
      width: var(--card-w);
      height: var(--card-h);
      overflow: visible;
      display: block;
    }

    .map-label {
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      fill: #0C2D4F;
      paint-order: stroke;
      stroke: #FFFFFF;
      stroke-width: 3.2px;
      stroke-linejoin: round;
    }

    .map-label--small {
      font-size: 10.5px;
      font-weight: 600;
      fill: #1F4D2A;
    }

    .sea-label {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      font-style: italic;
      letter-spacing: 0.24em;
      fill: #D4EEFB;
    }

    .compass-n {
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 700;
      fill: #FFFFFF;
    }

    .map-title-main {
      font-family: var(--font-heading);
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 0.02em;
      fill: #FFFFFF;
    }

    .map-title-sub {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3em;
      fill: #FFC85C;
    }

    .map-title-tag {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 500;
      font-style: italic;
      fill: #E3F3FC;
    }

    .banner-brand {
      font-family: var(--font-heading);
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      fill: var(--sb-blue);
    }

    .banner-web {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      fill: var(--sb-blue-deep);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 100;
      transform: translateX(-50%) translateY(24px);
      padding: 9px 20px;
      border-radius: 999px;
      background: var(--sb-blue-deep);
      color: #FFFFFF;
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: 0 10px 28px rgba(12, 56, 102, 0.3);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .toast.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .sun-rays,
      .swipe-hand-svg {
        animation: none;
      }
    }

    /* ==========================================================================
       PRINT SHEET — flat faces with 3 mm bleed, one side per 56 x 96 mm page
       (Ctrl+P, or open with ?print / ?print=front / ?print=back)
       ========================================================================== */
    @page {
      size: 56mm 96mm;
      margin: 0;
    }

    html.print-mode {
      --bleed: 24px;
      --print-zoom: 0.472441; /* 448 px face -> 56 mm page */
    }

    html.print-only-front,
    html.print-only-back {
      --print-zoom: 1;
    }

    html.print-mode,
    html.print-mode body {
      width: auto;
      height: auto;
      overflow: visible;
      background: #FFFFFF;
    }

    html.print-mode .stage,
    html.print-mode .card-viewport-box,
    html.print-mode .card-scene,
    html.print-mode .business-card {
      position: static;
      display: block;
      width: auto;
      height: auto;
      transform: none !important;
      perspective: none;
      transform-style: flat;
      will-change: auto;
    }

    html.print-mode .card-swipe-overlay,
    html.print-mode .toast {
      display: none;
    }

    html.print-mode .card-face {
      position: relative;
      inset: auto;
      width: calc(var(--card-w) + 2 * var(--bleed));
      height: calc(var(--card-h) + 2 * var(--bleed));
      border: 0;
      border-radius: 0;
      box-shadow: none;
      transform: none;
      backface-visibility: visible;
      -webkit-backface-visibility: visible;
      zoom: var(--print-zoom);
      break-after: page;
      page-break-after: always;
    }

    html.print-mode .card-face:last-child {
      break-after: auto;
      page-break-after: auto;
    }

    html.print-mode .sun-rays {
      animation: none;
    }

    html.print-only-front .card-face--back,
    html.print-only-back .card-face--front {
      display: none;
    }
  </style>
</head>
<body>

  <main class="stage" id="stage">
    <div class="card-viewport-box" id="cardViewportBox">
      <div class="card-scene" id="cardScene">

        <!-- One-Time Animated Swipe Overlay ON the Card (Plays once and disappears) -->
        <div class="card-swipe-overlay" id="swipeHint" aria-hidden="true">
          <div class="swipe-badge">
            <svg class="swipe-hand-svg" viewBox="0 0 120 120" width="54" height="54" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M42 23 C58 12, 82 16, 98 37 C80 25, 60 25, 45 31 C40 33, 37 27, 42 23 Z" fill="#0F70B8" />
              <g transform="rotate(-24 56 68)">
                <path
                  d="M36 69 V30 C36 24 44.5 24 44.5 30 V53
                     M44.5 45 C44.5 39.5 53 39.5 53 45 V54
                     M53 47 C53 41.5 61.5 41.5 61.5 47 V56
                     M61.5 50.5 C61.5 45.5 69.5 45.5 69.5 51 V70
                     C69.5 84.5 58.5 94 45.5 94
                     C35 94 28.5 87.5 23 78.5
                     L16.5 67.5 C14 63 20 58 24.5 61.5
                     L36 71"
                  fill="#FFFFFF"
                  stroke="#0F70B8"
                  stroke-width="4.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>
            </svg>
            <span class="swipe-caption">Swipe card to flip</span>
          </div>
        </div>

        <div class="business-card" id="businessCard" tabindex="0" role="region" aria-label="Sunbird Lanka Tours Business Card of Rohana Hettiarachchi. Swipe or tap to flip.">

          <!-- ================= FRONT SIDE ================= -->
          <div class="card-face card-face--front">
            <div class="card-accent-bar" aria-hidden="true"></div>

            <!-- Official Sunbird Lanka Tours Logo -->
            <div class="front-brand">
              <img src="sunbird-logo.png" alt="Sunbird Lanka Tours — Utmost Content in Tourism" class="brand-logo" draggable="false" />
            </div>

            <!-- Circle Profile Photo with Sun-Ray Halo + Name & Titles -->
            <div class="front-identity">
              <div class="profile-halo">
                <svg class="sun-rays" viewBox="-100 -100 200 200" aria-hidden="true">
                  <g stroke="#F7AC3B" stroke-linecap="round">
                    <g stroke-width="3" opacity="0.6">
                      <line x1="0" y1="-74" x2="0" y2="-94" />
                      <line x1="0" y1="74" x2="0" y2="94" />
                      <line x1="-74" y1="0" x2="-94" y2="0" />
                      <line x1="74" y1="0" x2="94" y2="0" />
                      <line x1="52.3" y1="-52.3" x2="66.5" y2="-66.5" />
                      <line x1="-52.3" y1="-52.3" x2="-66.5" y2="-66.5" />
                      <line x1="52.3" y1="52.3" x2="66.5" y2="66.5" />
                      <line x1="-52.3" y1="52.3" x2="-66.5" y2="66.5" />
                    </g>
                    <g stroke-width="2" opacity="0.38">
                      <line x1="28.3" y1="-68.4" x2="34.4" y2="-83.1" />

     * Sunbird Lanka Tours — Portrait 3D Business Card
     * - Portrait card stands upright on phones and desktop, so the tourist map always reads north-up
     * - One-time Swipe Hand animation directly ON the card that disappears after playing
     * - 60/120fps Spring-Physics 3D Swipe & Tap-to-Flip Engine (same feel as the other cards)
     * - Print sheet mode (see the <head> script) lays both sides out flat with bleed
     */
    (function () {
      'use strict';

      const businessCard = document.getElementById('businessCard');
      const swipeHint = document.getElementById('swipeHint');
      if (!businessCard) return;

      const BASE_CARD_WIDTH = 400;
      const BASE_CARD_HEIGHT = 720;
      const NO_FLIP_TARGETS = 'a, button';

      let currentVisualScale = 1;

      /* ======================================================================
         1. Responsive Scaler (portrait card fits the viewport upright)
         ====================================================================== */
      function updateCardLayout() {
        const availW = window.innerWidth - 24;
        const availH = window.innerHeight - 28;
        const scale = Math.min(availW / BASE_CARD_WIDTH, availH / BASE_CARD_HEIGHT);
        currentVisualScale = Math.max(0.4, Math.min(1.12, scale));
        document.documentElement.style.setProperty('--card-scale', currentVisualScale.toFixed(4));
      }

      updateCardLayout();
      window.addEventListener('resize', updateCardLayout);
      window.addEventListener('orientationchange', () => {
        setTimeout(updateCardLayout, 60);
      });

      /* ======================================================================
         2. One-Time On-Card Swipe Overlay Dismissal
         ====================================================================== */
      function dismissSwipeHint() {
        if (!swipeHint || swipeHint.classList.contains('is-dismissed')) return;
        swipeHint.classList.add('is-dismissed');
        setTimeout(() => {
          if (swipeHint && swipeHint.parentNode) {
            swipeHint.style.display = 'none';
          }
        }, 320);
      }

      if (swipeHint) {
        swipeHint.addEventListener('animationend', (e) => {
          if (e.target.classList.contains('swipe-badge')) {
            dismissSwipeHint();
          }
        });
        setTimeout(dismissSwipeHint, 2700);
      }

      /* ======================================================================
         3. 60/120fps Spring-Physics 3D Swipe & Tap-to-Flip Engine
         ====================================================================== */
      let baseAngle = 0;
      let targetAngle = 0;
      let currentAngle = 0;
      let velocity = 0;
      let currentScale = 1;
      let targetScale = 1;

      let isDragging = false;
      let activePointerId = null;
      let startX = 0;
      let startY = 0;
      let lastX = 0;
      let lastMoveTime = 0;
      let pointerVelocity = 0;
      let maxDragDistance = 0;
      let activeSwipeSpan = BASE_CARD_WIDTH;
      let rafId = null;

      const SPRING_TENSION = 0.085;
      const SPRING_FRICTION = 0.76;
      const DRAG_FOLLOW = 0.42;

      function startLoop() {
        if (rafId !== null) return;
        rafId = requestAnimationFrame(tick);
      }

      function tick() {
        if (isDragging) {
          velocity = (targetAngle - currentAngle) * DRAG_FOLLOW;
          currentAngle += velocity;
        } else {
          const springForce = (targetAngle - currentAngle) * SPRING_TENSION;
          velocity = (velocity + springForce) * SPRING_FRICTION;
          currentAngle += velocity;
        }

        currentScale += (targetScale - currentScale) * 0.22;
        const dynamicTiltX = Math.max(-4, Math.min(4, velocity * -0.18));

        businessCard.style.transform = `perspective(2000px) rotateY(${currentAngle.toFixed(3)}deg) rotateX(${dynamicTiltX.toFixed(3)}deg) scale3d(${currentScale.toFixed(4)}, ${currentScale.toFixed(4)}, 1)`;

        const angleSettled = Math.abs(targetAngle - currentAngle) < 0.05 && Math.abs(velocity) < 0.05;
        const scaleSettled = Math.abs(targetScale - currentScale) < 0.001;

        if (!isDragging && angleSettled && scaleSettled) {
          currentAngle = targetAngle;
          currentScale = targetScale;
          velocity = 0;
          businessCard.style.transform = `perspective(2000px) rotateY(${currentAngle}deg) rotateX(0deg) scale3d(1, 1, 1)`;
          rafId = null;
          return;
        }

        rafId = requestAnimationFrame(tick);
      }

      function flipBy(deltaDegrees) {
        baseAngle += deltaDegrees;
        targetAngle = baseAngle;
        targetScale = 1;

        if (navigator.vibrate) {
          try {
            navigator.vibrate(10);
          } catch (_) {}
        }

        startLoop();
      }

      // Gentle initial 3D peek impulse on page load synced with the one-time swipe icon
      setTimeout(() => {
        if (!isDragging && baseAngle === 0 && !document.documentElement.classList.contains('print-mode')) {
          velocity = -5.5;
          startLoop();
        }
      }, 450);

      businessCard.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;

        dismissSwipeHint();

        isDragging = true;
        activePointerId = e.pointerId;
        activeSwipeSpan = BASE_CARD_WIDTH * currentVisualScale;

        startX = e.clientX;
        startY = e.clientY;
        lastX = e.clientX;
        lastMoveTime = performance.now();
        pointerVelocity = 0;
        maxDragDistance = 0;

        targetAngle = baseAngle;
        targetScale = 1.018;
        startLoop();
      });

      window.addEventListener(
        'pointermove',
        (e) => {
          if (!isDragging || e.pointerId !== activePointerId) return;

          const now = performance.now();
          const dt = Math.max(1, now - lastMoveTime);
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;

          maxDragDistance = Math.max(maxDragDistance, Math.hypot(dx, dy));

          const instantV = (e.clientX - lastX) / dt;
          pointerVelocity = pointerVelocity * 0.6 + instantV * 0.4;
          lastX = e.clientX;
          lastMoveTime = now;

          targetAngle = baseAngle + (dx / Math.max(220, activeSwipeSpan)) * 185;
          startLoop();
        },
        { passive: true }
      );

      function finishPointerGesture(e) {
        if (!isDragging || (e && e.pointerId !== activePointerId)) return;
        isDragging = false;
        activePointerId = null;
        targetScale = 1;

        const draggedDegrees = targetAngle - baseAngle;

        if (maxDragDistance < 8) {
          const interactive = e && e.target && e.target.closest ? e.target.closest(NO_FLIP_TARGETS) : null;
          if (interactive) {
            targetAngle = baseAngle;
            startLoop();
            return;
          }
          flipBy(180);
          return;
        }

        const isFastFlick = Math.abs(pointerVelocity) > 0.24 && maxDragDistance > 16;
        const isFarEnoughDrag = Math.abs(draggedDegrees) > 34;

        if (isFastFlick || isFarEnoughDrag) {
          const direction = (isFastFlick ? pointerVelocity : draggedDegrees) >= 0 ? 1 : -1;
          velocity += pointerVelocity * 8.5;
          flipBy(direction * 180);
        } else {
          targetAngle = baseAngle;
          startLoop();
        }
      }

      window.addEventListener('pointerup', finishPointerGesture);
      window.addEventListener('pointercancel', finishPointerGesture);

      businessCard.addEventListener(
        'click',
        (e) => {
          if (maxDragDistance >= 8) {
            e.preventDefault();
            e.stopPropagation();
          }
        },
        true
      );

      businessCard.addEventListener('keydown', (e) => {
        if (e.target !== businessCard) return;
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') {
          e.preventDefault();
          flipBy(180);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          flipBy(-180);
        }
      });

      /* ======================================================================
         4. Save Contact (.vcf) — tap the QR tile on the digital card
         ====================================================================== */
      const toast = document.getElementById('toastBox');
      let toastTimer = null;

      function showToast(msg) {
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2600);
      }

      const btnSaveContact = document.getElementById('btnSaveContact');
      if (btnSaveContact) {
        btnSaveContact.addEventListener('click', () => {
          const vcardData = [
            'BEGIN:VCARD',
            'VERSION:3.0',
            'N:Hettiarachchi;Rohana;;;',
            'FN:Rohana Hettiarachchi',
            'ORG:Sunbird Lanka Tours',
            'TITLE:CEO & Managing Director\\, National Tourist Guide Lecturer',
            'TEL;TYPE=CELL,VOICE:+94766800130',
            'TEL;TYPE=WORK,VOICE:+94112938465',
            'EMAIL;TYPE=WORK,INTERNET:rohana@sunbirdtours.lk',
            'EMAIL;TYPE=WORK,INTERNET:sunbirdlankatours@gmail.com',
            'URL:http://www.sunbirdtours.lk',
            'ADR;TYPE=WORK:;;No.430\\, Handala Road;Wattala;Western Province;11300;Sri Lanka',
            'NOTE:National Tourist Guide Lecturer (ACA\\, B.B Mgt.(Acc) Sp. Hons). Tailor-made private tours\\, wildlife safaris and cultural tours across Sri Lanka. Digital card: https://vockshel-gif.github.io/RohanaHettiarachchi/sunbird.html',
            'END:VCARD'
          ].join('\r\n');

          const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'Rohana_Hettiarachchi_Sunbird_Lanka_Tours.vcf';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast('Contact card downloaded');
        });
      }
    })();
  </script>
</body>
</html>
