<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rohana Hettiarachchi — Printable QR Business Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #0b0c0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 16px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Standard Business Card Aspect Ratio (1.65 : 1) */
    .topo-qr-card {
      position: relative;
      width: min(100%, 600px);
      aspect-ratio: 1.65 / 1;
      background-color: #141518;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid #8c7647;
      border-top: 7px solid #9a824f;
      box-shadow:
        0 30px 65px -12px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(197, 165, 90, 0.22);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 32px 20px;
    }

    /* Continuous Unbroken Gold Topographic Contour Map Background */
    .topo-bg-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 1;
    }

    /* Foreground Content Floating Seamlessly Over Continuous Pattern (No Cutoff Box!) */
    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
    }

    .main-elements-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 44px;
    }

    /* Large Profile Picture in Metallic Gold Ring */
    .profile-gold-wrap {
      width: 168px;
      height: 168px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #e5c675 0%, #8c7542 50%, #d4b263 100%);
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.82);
      flex-shrink: 0;
    }

    .profile-gold-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 18%;
      border: 3px solid #141518;
      display: block;
    }

    /* Gold Vertical Divider */
    .center-divider {
      width: 2px;
      height: 126px;
      background: linear-gradient(180deg, transparent, #c5a358, transparent);
      flex-shrink: 0;
    }

    /* Large Scannable QR Code Frame */
    .qr-gold-frame {
      width: 168px;
      height: 168px;
      border-radius: 18px;
      padding: 11px;
      background: #ffffff;
      border: 3.5px solid #b59652;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .qr-gold-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Businessman Name Badge */
    .name-plate {
      text-align: center;
      padding: 6px 22px;
      border-radius: 999px;
      background: rgba(20, 21, 24, 0.78);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(197, 163, 88, 0.42);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .businessman-name {
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ebd189 0%, #c8a656 50%, #ebd189 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #dfc072;
    }

    /* Print Action Bar (Hidden when printing) */
    .actions-bar {
      display: flex;
      gap: 12px;
    }

    .action-btn {
      background: linear-gradient(135deg, #d4b46a, #8c7542);
      color: #141518;
      border: none;
      padding: 10px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .action-btn:hover {
      transform: translateY(-1px);
    }

    @media (max-width: 520px) {
      .topo-qr-card {
        padding: 16px 18px 14px;
      }
      .main-elements-row {
        gap: 22px;
      }
      .profile-gold-wrap,
      .qr-gold-frame {
        width: 118px;
        height: 118px;
      }
      .center-divider {
        height: 86px;
      }
      .businessman-name {
        font-size: 0.86rem;
        letter-spacing: 0.09em;
      }
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .actions-bar {
        display: none !important;
      }
      .topo-qr-card {
        width: 3.5in;
        height: 2in;
        box-shadow: none;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
